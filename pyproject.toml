[project]
authors = [{name = "Johannes Tenhumberg", email = "johannes.tenhumberg@gmail.com"}]
name = "wzk"
requires-python = ">=3.13"
version = "0.1.1"
dependencies = [
    "einops>=0.8",
    "fire>=0.7",
    "jax>=0.9.0.1",
    "jaxtyping>=0.3.7",
    "joblib>=1.4",
    "matplotlib>=3.10",
    "msgpack>=1.1.2",
    "numpy>2.0",
    "plotly>=6.0",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.15",
]

[project.optional-dependencies]
bayes = ["bayesian-optimization>=1.5"]
gcp = ["google-cloud-compute>=1.22", "google-cloud-storage>=2.18"]
image = ["pillow>=10"]
input = ["pynput>=1.8"]
meshcat = ["meshcat>=0.3.2"]
ortools = ["ortools>=9.14.6206"]   # pypi-only (not on conda-forge)
pandas = ["pandas>=2.0"]
pdf = ["pikepdf>=10"]
pyopt = ["pyOpt"]                       # pypi-only (not on conda-forge)
shinka = ["shinka"]                     # pypi-only (not on conda-forge)
swarms = ["pyswarms>=1.3"]
wandb = ["wandb>=0.19"]

# Dev tooling lives in a dependency-group, not an optional-dependency extra,
# so that a plain `uv sync --dev` installs it — the same shape every sibling
# repo uses. As an extra it needed `--extra dev`, which nothing (including CI)
# actually passed, so a synced venv silently had no ruff/ty/pytest.
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    # Exact, and identical across the sibling repos (see robot-zoo/rokin).
    "ruff==0.15.10",
    "ty==0.0.63",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wzk"
module-root = ""


# Ruff


[tool.ty.src]
include = ["./", "wzk/"]
# tmp/ is dated scratch probes, not shipped code (same convention as wogen).
exclude = [".venv/", "tmp/"]

[tool.ty.rules]
# Suppress false positives from numpy/matplotlib typing
not-subscriptable = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
unresolved-attribute = "ignore"
no-matching-overload = "ignore"
invalid-parameter-default = "ignore"
not-iterable = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
call-non-callable = "ignore"
unknown-argument = "ignore"
missing-argument = "ignore"
invalid-method-override = "ignore"
positional-only-parameter-as-kwarg = "ignore"
invalid-declaration = "ignore"
possibly-missing-attribute = "ignore"
unused-type-ignore-comment = "warn"
# Optional dependencies
unresolved-import = "ignore"
# Two rules that ty 0.0.63 added (0.0.15 did not have them). Both flag real but
# non-urgent debt rather than false positives, so they are deferred, not dismissed:
#   possibly-missing-submodule — mpl2/figure.py, io/files.py and np2/basics.py reach
#     `matplotlib.<sub>` / `np._core` without importing the submodule; works only
#     because something else imported it first.
#   deprecated — video.py:30,39 still shell out via `os.system` (use subprocess).
possibly-missing-submodule = "ignore"
deprecated = "ignore"

[tool.ty.environment]
python-version = "3.13"


