name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAX_PLATFORMS: cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      # --frozen: install exactly the committed uv.lock, no re-resolution, so
      # CI is reproducible and an upstream release cannot turn it red on its
      # own. Requires uv.lock to be committed (it is, as of 2026-08-24).
      # Fails when pyproject.toml was edited without re-locking, which --frozen
      # would otherwise hide. Safe here because wzk has no [tool.uv.sources]
      # siblings (repos that clone siblings at latest main cannot assert this).
      - name: Lockfile is up to date
        run: uv lock --check
      - run: uv sync --dev --frozen
      - name: Lint
        run: uv run --frozen ruff check wzk/
      - name: Format check
        run: uv run --frozen ruff format --check wzk/
      - name: Type check
        run: uv run --frozen ty check
