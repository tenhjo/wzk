name: deps-drift

# Committed locks + `uv sync --frozen` make CI reproducible, but they also mean
# CI can no longer tell you when a NEW upstream release breaks you — it keeps
# installing last week's versions forever. This job restores that signal
# deliberately instead of at random: once a week it re-resolves everything to
# the newest versions the constraints allow and runs the same checks.
#
# It never commits. A red run means "a newer dependency breaks us", which is
# information, not an emergency — triage it, then either fix the code or add a
# constraint with a comment stating the reason and the exit condition (see
# ~/dev/src/AGENTS.md §2.6).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  JAX_PLATFORMS: cpu

jobs:
  unpinned:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - name: Re-resolve to newest allowed versions
        run: uv lock --upgrade
      - name: Show what moved
        run: git --no-pager diff --stat uv.lock || true
      - run: uv sync --dev
      - name: Lint
        run: uv run ruff check wzk/
      - name: Format check
        run: uv run ruff format --check wzk/
      - name: Type check
        run: uv run ty check
